<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CIS4004 Tables and Forms</title>
  </head>
  <body>
	<form action="TablesAndFormsAssignment.html">
    <h1>Pizza Ordering Form</h1>
	
	<section>
		<h2>ContactInformation</h2>
			<label for="fName">Name: </label>
			<input type="text" id="fName" name="fName" required><br>
			<label for="fPhone">Phone: </label>
			<input type="text" id="fPhone" name="fPhone" required><br>
			<label for="fMail">Email: </label>
			<input type="text" id="fMail" name="fMail" required><br>
	</section>
	<section>
		<h2>Select Pizza Size</h2>
		<label>Pizza Size: </label>
		<select name="pizzaSize" id="pizzaSize" placeholder="--Select Size--" required>
			<option>Medium</option>
			<option>Large</option>
			<option>XLarge</option>
		</select>
	</section>
	<section>
		<h2>Select Sauce</h2>
		<input type="radio" name="pizzaSauce" required><label>Marinara</label><br>
		<input type="radio" name="pizzaSauce" required><label>Ranch</label><br>
		<input type="radio" name="pizzaSauce" required><label>No Sauce</label><br>
	</section>
	<section>
		<h2>Select Toppings</h2>
		<input type="checkbox" id="topping1" name="topping1" value="Pepperoni">
		<label for="topping1">Pepperoni</label>
		<input type="checkbox" id="topping2" name="topping2" value="Sausage">
		<label for="topping2">Sausage</label><br>
		<input type="checkbox" id="topping3" name="topping3" value="Mushroom">
		<label for="topping3">Mushroom</label>
		<input type="checkbox" id="topping4" name="topping4" value="Pineapple">
		<label for="topping4">Pineapple</label><br>
		<input type="checkbox" id="topping5" name="topping5" value="Peppers">
		<label for="topping5">Peppers</label>
		<input type="checkbox" id="topping6" name="topping6" value="Onions">
		<label for="topping6">Onions</label><br>
	</section>
	<section>
		<h2>Additional Instructions</h2>
		<textarea id="instructions" name="instructions" placeholder="Additional instructions"></textarea><br>
		<input type="submit" value="Submit!">
	</section>
	</form>
	<br>
	<br>
	<br>
		<span>List of Favourite Video Games</span>
		<table Border 1px>
			<tr>
				<th>Developer</th>
				<th>Title</th>
				<th>Year</th>
			</tr>
			<tr>
				<td rowspan="3">Devolver Digital</td>
				<td>Cult of The Lamb</td>
				<td>2022</td>
			</tr>
			<tr>
				<td>Enter the Gungeon</td>
				<td>2016</td>
			</tr>
			<tr>
				<td>Hotline Miami</td>
				<td>2012</td>
			</tr>
			<tr>
				<td>Re-logic</td>
				<td>Terraria</td>
				<td>2011</td>
			</tr>
			<tr>
				<td colspan="3">Count: 4</td>
			</tr>
		</table>
  </body>
</html>
